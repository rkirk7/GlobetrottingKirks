<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Styles/style.css">

<style>
body { position: relative; }
p { font-size: clamp(1rem, 2vw + 0.5rem, 1.2rem); line-height: 1.6; }
h1 { font-size: clamp(1.5rem, 3vw + 0.5rem, 2.5rem); }
h2 { font-size: clamp(1.3rem, 2.5vw + 0.5rem, 2rem); }
h3 { font-size: clamp(1.1rem, 2vw + 0.5rem, 1.5rem); }

#toc {
  position: fixed; top: 80px; right: 20px;
  max-width: 250px; background: #fff;
  border: 1px solid #ddd; padding: 10px; border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  max-height: 80vh; overflow-y: auto; z-index: 999;
  font-size: 0.95rem;
}
#toc h5 { font-size: 1rem; margin-bottom: 8px; }
#toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
#toc li { margin-bottom: 4px; }
#toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
#toc a:hover { color: #007bff; text-decoration: underline; }

#post-content img { max-width: 80%; height: auto; display: block; margin: 0 auto; border-radius: 6px; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  grid-auto-rows: 10px; /* base row height for calculation */
  gap: 15px;
  margin: 20px 0;
}

.gallery figure {
  display: block;
  margin: 0;
  /* each figure will stretch over multiple rows based on image height */
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.2s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

.figure-caption {
  text-align: center;
  margin-top: 4px;
  font-size: 0.9rem;
  color: #555;
}

.blog-post-content img:only-child { display: block; margin: 0 auto; }

@media (max-width: 768px) {
  #toc { position: static; max-width: 100%; margin: 15px 0; box-shadow: none; border: 1px solid #ddd; }
  #toc a { font-size: 0.85rem; }
}
</style>
</head>
<body class="bg-light">

<div class="blog-container">
  <div class="container mt-4 mb-5">
    <div id="post-container" class="card shadow-lg">
      <div class="card-body">
        <h1 id="post-title" class="mb-3"></h1>
        <div id="post-content" class="blog-post-content"></div>
        <div class="mt-3">
          <button id="shareBtn" class="btn btn-outline-primary">Share Post</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating TOC -->
<div id="toc" class="d-none">
  <h5>On this page</h5>
  <ul id="toc-list"></ul>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script src="Scripts/loadpage.js"></script>

<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const postFile = params.get('post');
  if (!postFile) return;

  let postText = await fetch(`blog-posts/${postFile}`).then(r => r.text());
  postText = postText.replace(/^---[\s\S]*?---/, '').trim();

  const lines = postText.split("\n");
  const firstHeadingIndex = lines.findIndex(l => l.startsWith("# "));
  const postTitle = firstHeadingIndex >= 0 ? lines[firstHeadingIndex].replace(/^# /,'') : postFile;
  document.getElementById('post-title').textContent = postTitle;
  if(firstHeadingIndex >= 0) lines.splice(firstHeadingIndex,1);
  postText = lines.join("\n");

  // --- Parse Markdown ---
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = marked.parse(postText);

  const postContentEl = document.getElementById('post-content');
  postContentEl.innerHTML = '';
  postContentEl.appendChild(tempDiv);

  // --- Process images ---
function processImages(container) {
  if (!container) return;

  let galleryCounter = 0; // To create unique gallery groups

  // --- Process galleries ---
  container.querySelectorAll('.gallery').forEach(gallery => {
    galleryCounter++;
    const galleryGroup = `gallery-${galleryCounter}`;

    // Get all images (even inside <p>)
    const imgs = gallery.querySelectorAll('img, p > img');
    gallery.innerHTML = ''; // Clear gallery

    imgs.forEach(img => {
      const src = img.getAttribute('src');
      const fileName = src?.split('/').pop();
      const caption = window._imageData?.[fileName] || img.alt || '';

      // Build figure
      const figure = document.createElement('figure');
      figure.classList.add('figure', 'text-center');

      // Wrap img in <a> for GLightbox
      const link = document.createElement('a');
      link.href = src;
      link.setAttribute('data-glightbox', `title:${caption}; gallery:${galleryGroup}`);
      link.classList.add('glightbox');

      img.classList.add('img-fluid');
      img.setAttribute('loading', 'lazy');

      link.appendChild(img);
      figure.appendChild(link);

      if (caption) {
        const figcap = document.createElement('figcaption');
        figcap.classList.add('figure-caption', 'text-center');
        figcap.textContent = caption;
        figure.appendChild(figcap);
      }

      gallery.appendChild(figure);
    });

    // --- Masonry sizing ---
    function resizeMasonryItems() {
      const rowHeight = parseInt(getComputedStyle(gallery).getPropertyValue('grid-auto-rows'));
      const rowGap = parseInt(getComputedStyle(gallery).getPropertyValue('gap'));

      gallery.querySelectorAll('figure').forEach(figure => {
        const contentHeight = figure.querySelector('img').getBoundingClientRect().height +
                              (figure.querySelector('figcaption')?.getBoundingClientRect().height || 0);
        const rowSpan = Math.ceil((contentHeight + rowGap) / (rowHeight + rowGap));
        figure.style.gridRowEnd = `span ${rowSpan}`;
      });
    }

    // Call after images load
    window.addEventListener('load', resizeMasonryItems);
    window.addEventListener('resize', resizeMasonryItems);
  });

  // --- Process standalone images ---
  container.querySelectorAll('img:not(.glightbox)').forEach(img => {
    const src = img.getAttribute('src');
    const fileName = src?.split('/').pop();
    const caption = window._imageData?.[fileName] || img.alt || '';

    const figure = document.createElement('figure');
    figure.classList.add('figure', 'text-center');

    const link = document.createElement('a');
    link.href = src;
    link.setAttribute('data-glightbox', `title:${caption}; gallery:standalone`);
    link.classList.add('glightbox');

    img.classList.add('img-fluid');
    img.setAttribute('loading', 'lazy');

    link.appendChild(img);
    figure.appendChild(link);

    if (caption) {
      const figcap = document.createElement('figcaption');
      figcap.classList.add('figure-caption', 'text-center');
      figcap.textContent = caption;
      figure.appendChild(figcap);
    }

    img.parentNode.insertBefore(figure, img);
    figure.appendChild(img);
  });

  // --- Initialize or reload GLightbox ---
  if (typeof GLightbox !== 'undefined') {
    if (!window.glightboxInstance) {
      window.glightboxInstance = GLightbox({ selector: '.glightbox' });
    } else {
      window.glightboxInstance.reload();
    }
  }
}


  processImages(postContentEl);

  // --- TOC ---
  const tocList = document.getElementById('toc-list');
  tocList.innerHTML = '';

  const topLi = document.createElement('li');
  const topA = document.createElement('a');
  topA.href="#"; topA.textContent="Top";
  topA.addEventListener('click', e=>{
    e.preventDefault();
    window.scrollTo({top:0, behavior:'smooth'});
  });
  topLi.appendChild(topA);
  tocList.appendChild(topLi);

  const headings = postContentEl.querySelectorAll('h1,h2,h3');
  headings.forEach((h,i)=>{
    const id = `heading-${i}`;
    h.id = id;
    const li = document.createElement('li');
    li.innerHTML=`<a href="#${id}">${h.textContent}</a>`;
    tocList.appendChild(li);
  });
}
document.addEventListener("DOMContentLoaded", loadPost);

</script>


</body>
</html>
