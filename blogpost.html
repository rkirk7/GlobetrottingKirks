<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Styles/style.css">

<style>
.blog-card {
  max-width: 850px;
  margin: 0 auto;
  width: 100%;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  background: #fff;
}

@media (max-width: 768px) {
  .blog-card {
    max-width: 100%;
    border-radius: 0;
    box-shadow: none;
  }
}

body { position: relative; }
p { font-size: clamp(1rem, 2vw + 0.5rem, 1.2rem); line-height: 1.6; }
h1 { font-size: clamp(1.5rem, 3vw + 0.5rem, 2.5rem); }
h2 { font-size: clamp(1.3rem, 2.5vw + 0.5rem, 2rem); }
h3 { font-size: clamp(1.1rem, 2vw + 0.5rem, 1.5rem); }

/* Desktop TOC */
#toc {
  position: fixed;
  top: 80px;
  right: 20px;
  max-width: 250px;
  background: #fff;
  border: 1px solid #ddd;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  max-height: 80vh;
  overflow-y: auto;
  z-index: 999;
  font-size: 0.95rem;
  transition: transform 0.3s ease;
}
#toc h5 { font-size: 1rem; margin-bottom: 8px; }
#toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
#toc li { margin-bottom: 4px; }
#toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
#toc a:hover { color: #007bff; text-decoration: underline; }

/* Mobile TOC slide */
@media (max-width: 768px) {
  #toc {
    top: 0;
    right: 0;
    height: 100vh;
    max-width: 280px;
    transform: translateX(100%);
    border-radius: 0;
    box-shadow: -2px 0 6px rgba(0,0,0,0.1);
  }
  #toc.show { transform: translateX(0); }

  #toc-toggle {
    display: block;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    border-radius: 50px;
    padding: 10px 14px;
    font-size: 0.9rem;
  }
}

@media (min-width: 769px) {
  #toc-toggle { display: none; }
}

#post-content img { max-width: 80%; height: auto; display: block; margin: 0 auto; border-radius: 6px; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin: 20px 0;
}
.gallery figure { margin: 0; }
.gallery img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 6px;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: transform 0.2s ease;
}
.gallery img:hover { transform: scale(1.03); }
.figure-caption {
  text-align: center;
  margin-top: 4px;
  font-size: 0.9rem;
  color: #555;
}
.blog-post-content img:only-child { display: block; margin: 0 auto; }
</style>
</head>
<body class="bg-light">

<div id="post-container" class="card blog-card mt-4 mb-5">
  <div class="card-body">
    <h1 id="post-title" class="mb-3"></h1>
    <div id="post-content" class="blog-post-content"></div>
    <div class="mt-3">
      <button id="shareBtn" class="btn btn-outline-primary">Share Post</button>
    </div>
  </div>
</div>

<!-- TOC -->
<div id="toc">
  <h5>On this page</h5>
  <ul id="toc-list"></ul>
</div>

<!-- Mobile TOC Toggle -->
<button id="toc-toggle" class="btn btn-primary">☰ TOC</button>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const postFile = params.get('post');
  if (!postFile) return;

  let postText = await fetch(`blog-posts/${postFile}`).then(r => r.text());
  postText = postText.replace(/^---[\s\S]*?---/, '').trim();

  const lines = postText.split("\n");
  const firstHeadingIndex = lines.findIndex(l => l.startsWith("# "));
  const postTitle = firstHeadingIndex >= 0 ? lines[firstHeadingIndex].replace(/^# /,'') : postFile;
  document.getElementById('post-title').textContent = postTitle;
  if(firstHeadingIndex >= 0) lines.splice(firstHeadingIndex,1);
  postText = lines.join("\n");

  // const tempDiv = document.createElement('div');
  // tempDiv.innerHTML = marked.parse(postText);

  // const postContentEl = document.getElementById('post-content');
  // postContentEl.innerHTML = '';
  // postContentEl.appendChild(tempDiv);

postContentEl.innerHTML = marked.parse(postText);


  // Image processing
  function processImages(container) {
    if (!container) return;
    const allImages = [];
    let galleryCounter = 0;

    container.querySelectorAll('.gallery').forEach(gallery => {
      galleryCounter++;
      const imgs = gallery.querySelectorAll('img, p > img');
      gallery.innerHTML = '';
      imgs.forEach(img => {
        const src = img.getAttribute('src');
        const fileName = src?.split('/').pop();
        const caption = window._imageData?.[fileName] || img.alt || '';
        const figure = document.createElement('figure');
        figure.classList.add('figure');

        const link = document.createElement('a');
        link.href = src;
        link.classList.add('glightbox');
        link.setAttribute('data-gallery', 'page-gallery');
        link.setAttribute('data-title', caption);

        img.classList.add('img-fluid');
        img.setAttribute('loading', 'lazy');

        link.appendChild(img);
        figure.appendChild(link);

        if (caption) {
          const figcap = document.createElement('figcaption');
          figcap.classList.add('figure-caption');
          figcap.textContent = caption;
          figure.appendChild(figcap);
        }
        gallery.appendChild(figure);
        allImages.push(link);
      });
    });

    container.querySelectorAll('img').forEach(img => {
      if (img.closest('.gallery') || img.closest('figure')) return;
      const src = img.getAttribute('src');
      const fileName = src?.split('/').pop();
      const caption = window._imageData?.[fileName] || img.alt || '';
      const figure = document.createElement('figure');
      figure.classList.add('figure');

      const link = document.createElement('a');
      link.href = src;
      link.classList.add('glightbox');
      link.setAttribute('data-gallery', 'page-gallery');
      link.setAttribute('data-title', caption);

      img.classList.add('img-fluid');
      img.setAttribute('loading', 'lazy');

      link.appendChild(img);
      figure.appendChild(link);

      if (caption) {
        const figcap = document.createElement('figcaption');
        figcap.classList.add('figure-caption');
        figcap.textContent = caption;
        figure.appendChild(figcap);
      }
      img.replaceWith(figure);
      allImages.push(link);
    });

    setTimeout(() => {
      if (typeof GLightbox !== 'undefined') {
        if (!window.glightboxInstance) {
          window.glightboxInstance = GLightbox({ selector: '.glightbox' });
        } else {
          window.glightboxInstance.reload();
        }
      }
    }, 50);
  }

  if (!window._imageData) {
    try {
      const res = await fetch("image-data.json");
      window._imageData = res.ok ? await res.json() : {};
    } catch (err) {
      window._imageData = {};
    }
  }

  processImages(postContentEl);

  // Build TOC
  const tocList = document.getElementById('toc-list');
  tocList.innerHTML = '';
  const topLi = document.createElement('li');
  const topA = document.createElement('a');
  topA.href = "#";
  topA.textContent = "Top";
  topA.addEventListener('click', e => {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  topLi.appendChild(topA);
  tocList.appendChild(topLi);

  const headings = postContentEl.querySelectorAll('h1,h2,h3');
  headings.forEach((h,i) => {
    const id = `heading-${i}`;
    h.id = id;
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${id}">${h.textContent}</a>`;
    tocList.appendChild(li);
  });
}
document.addEventListener("DOMContentLoaded", loadPost);

// Mobile toggle
document.addEventListener("DOMContentLoaded", function () {
  const toc = document.getElementById("toc");
  const tocToggle = document.getElementById("toc-toggle");

  tocToggle?.addEventListener("click", () => toc.classList.toggle("show"));
  toc.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      if (window.innerWidth <= 768) toc.classList.remove("show");
    });
  });

  let touchStartX = 0, touchEndX = 0;
  toc.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; });
  toc.addEventListener("touchend", e => { 
    touchEndX = e.changedTouches[0].screenX; 
    if (window.innerWidth <= 768 && touchEndX - touchStartX < -50) toc.classList.remove("show");
  });
});
</script>

</body>
</html>
