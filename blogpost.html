  <style>

    body { position: relative; }
    p { font-size: 1.5em; }
    #toc {
      position: fixed; top: 80px; right: 20px;
      max-width: 250px; background: #fff;
      border: 1px solid #ddd; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-height: 80vh; overflow-y: auto; z-index: 999;
      font-size: 0.95rem;
    }
    #toc h5 { font-size: 1rem; margin-bottom: 8px; }
    #toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
    #toc li { margin-bottom: 4px; }
    #toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
    #toc a:hover { color: #007bff; text-decoration: underline; }

    #post-content img {
  max-width: 80%;
  height: auto;
  display: block;
  margin: 0 auto; /* Optional: center images */
  border-radius: 6px; /* Optional: match card rounding */
}

/* Gallery grid layout */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin: 20px 0;
}

/* Gallery images */
.gallery img {
  width: 100%;
  height: auto;
  border-radius: 6px;
  display: block;
  object-fit: cover;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  transition: transform 0.2s ease;
}

.gallery img:hover {
  transform: scale(1.03);
}

/* Captions under each image */
.gallery .caption {
  text-align: center;
  font-size: 0.9rem;
  color: #555;
  margin-top: 6px;
}

/* Keep captions aligned properly */
.gallery > * {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Optional: center single images nicely */
.blog-post-content img:only-child {
  display: block;
  margin: 0 auto;
}


@media (max-width: 768px) {
  #toc {
    position: static;      /* no longer fixed */
    max-width: 100%;       /* full width on mobile */
    margin: 15px 0;        /* spacing */
    box-shadow: none;      /* cleaner look */
    border: 1px solid #ddd;
  }
}

    // Share post

      const url = window.location.href;
