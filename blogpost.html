<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Styles/style.css">

<style>
  body { position: relative; }
/* Responsive paragraph font size */
p {
  font-size: clamp(1rem, 2vw + 0.5rem, 1.2rem);
  line-height: 1.6;
}


h1 {
  font-size: clamp(1.5rem, 3vw + 0.5rem, 2.5rem);
}
h2 {
  font-size: clamp(1.3rem, 2.5vw + 0.5rem, 2rem);
}
h3 {
  font-size: clamp(1.1rem, 2vw + 0.5rem, 1.5rem);
}

  #toc {
    position: fixed; top: 80px; right: 20px;
    max-width: 250px; background: #fff;
    border: 1px solid #ddd; padding: 10px; border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    max-height: 80vh; overflow-y: auto; z-index: 999;
    font-size: 0.95rem;
  }
  #toc h5 { font-size: 1rem; margin-bottom: 8px; }
  #toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
  #toc li { margin-bottom: 4px; }
  #toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
  #toc a:hover { color: #007bff; text-decoration: underline; }

  #post-content img {
    max-width: 80%;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 6px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin: 20px 0;
  }

  .gallery img {
    width: 100%;
    height: auto;
    border-radius: 6px;
    display: block;
    object-fit: cover;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease;
  }

  .gallery img:hover {
    transform: scale(1.03);
  }

  .gallery > * {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .blog-post-content img:only-child {
    display: block;
    margin: 0 auto;
  }

  @media (max-width: 768px) {
    #toc {
      position: static;
      max-width: 100%;
      margin: 15px 0;
      box-shadow: none;
      border: 1px solid #ddd;
    }
  }

  @media (max-width: 768px) {
  #toc a {
    font-size: 0.85rem;
  }
}
</style>
</head>
<body class="bg-light">

<div class="blog-container">
  <div class="container mt-4 mb-5">
    <div id="post-container" class="card shadow-lg">
      <div class="card-body">
        <h1 id="post-title" class="mb-3"></h1>
        <div id="post-content" class="blog-post-content"></div>
        <div class="mt-3">
          <button id="shareBtn" class="btn btn-outline-primary">Share Post</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating TOC -->
<div id="toc" class="d-none">
  <h5>On this page</h5>
  <ul id="toc-list"></ul>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
async function loadPost() {
  const params = new URLSearchParams(window.location.search);
  const postFile = params.get('post');
  if (!postFile) return;

  // Load Markdown
  let postText = await fetch(`blog-posts/${postFile}`).then(res => res.text());
  postText = postText.replace(/^---[\s\S]*?---/, '').trim();

  // Extract title
  const lines = postText.split("\n");
  const firstHeadingIndex = lines.findIndex(l => l.startsWith("# "));
  const postTitle = firstHeadingIndex >= 0 ? lines[firstHeadingIndex].replace(/^# /, "") : postFile;
  document.getElementById('post-title').textContent = postTitle;

  if (firstHeadingIndex >= 0) lines.splice(firstHeadingIndex, 1);
  postText = lines.join("\n");

  // Parse Markdown
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = marked.parse(postText);

  const postContentEl = document.getElementById('post-content');
  postContentEl.innerHTML = '';
  postContentEl.appendChild(tempDiv);

  // Add captions automatically
  addCaptions(postContentEl);

  // Build TOC
  const tocList = document.getElementById('toc-list');
  const headings = postContentEl.querySelectorAll('h1, h2, h3');
  if (headings.length > 0) {
    document.getElementById('toc').classList.remove('d-none');
    tocList.innerHTML = '';
    headings.forEach((heading, i) => {
      const id = `heading-${i}`;
      heading.id = id;
      tocList.innerHTML += `<li><a href="#${id}">${heading.textContent}</a></li>`;
    });
  }
}

// Universal caption function
function addCaptions(container) {
  if (!container) return;
  const images = Array.from(container.querySelectorAll("img"));

  images.forEach(img => {
    if (img.dataset.captionProcessed) return;

    // Wrap in figure
    if (!img.closest("figure")) {
      const figure = document.createElement("figure");
      figure.classList.add("figure", "text-center");
      img.parentNode.insertBefore(figure, img);
      figure.appendChild(img);
    }

    // Add figcaption
    const captionText = img.alt || "";
    if (captionText && !img.nextElementSibling?.classList.contains('figure-caption')) {
      const figcap = document.createElement("figcaption");
      figcap.classList.add("figure-caption", "text-center");
      figcap.textContent = captionText;
      img.parentNode.appendChild(figcap);
    }

    // Lightbox + lazy
    img.setAttribute("data-glightbox", `title: ${captionText}`);
    if (!img.hasAttribute("loading")) img.setAttribute("loading", "lazy");

    img.dataset.captionProcessed = "true";
  });

  // Initialize GLightbox once
  if (window.GLightbox && !window.gLightboxInstance) {
    window.gLightboxInstance = GLightbox({ selector: 'img[data-glightbox]' });
  }
}

// Share button
function sharePost() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => alert("Post URL copied!"));
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadPost();
  document.getElementById("shareBtn").addEventListener("click", sharePost);

  // Example for homepage or other pages
  const homepageContent = document.getElementById("content");
  if (homepageContent) addCaptions(homepageContent);
});
</script>

</body>
</html>
