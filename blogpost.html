<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body { position: relative; background: #f9f9f9; }

    /* Floating TOC */
    #toc {
      position: fixed; top: 80px; right: 20px;
      max-width: 250px; background: #fff;
      border: 1px solid #ddd; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-height: 80vh; overflow-y: auto; z-index: 999;
      font-size: 0.95rem;
    }
    #toc h5 { font-size: 1rem; margin-bottom: 8px; }
    #toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
    #toc li { margin-bottom: 4px; }
    #toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
    #toc a:hover { color: #007bff; text-decoration: underline; }

    /* Blog Post Container */
    #post-container {
      max-width: 800px;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
    }
    #post-title {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }
    .blog-post-content p {
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .blog-post-content img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 15px auto;
      border-radius: 6px;
    }
    figure {
      margin: 20px 0;
      text-align: center;
    }
    figcaption {
      font-size: 0.9rem;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container mt-4 mb-5">
    <div id="post-container" class="card shadow-lg">
      <div class="card-body">
        <h1 id="post-title"></h1>
        <div id="post-content" class="blog-post-content"></div>
        <div class="mt-3">
          <button id="shareBtn" class="btn btn-outline-primary btn-sm">Share Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating TOC -->
  <div id="toc" class="d-none">
    <h5>On this page</h5>
    <ul id="toc-list"></ul>
  </div>

  <!-- Bootstrap JS + Marked -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postFile = params.get('post');
      if (!postFile) return;

      // Load Markdown
      let postText = await fetch(`blog-posts/${postFile}`).then(res => res.text());
      postText = postText.replace(/^---[\\s\\S]*?---/, '').trim();

      // Extract title
      const lines = postText.split("\\n");
      const firstHeadingIndex = lines.findIndex(l => l.startsWith("# "));
      const postTitle = firstHeadingIndex >= 0 ? lines[firstHeadingIndex].replace(/^# /, "") : postFile;
      document.getElementById('post-title').textContent = postTitle;

      // Remove H1 from content so it doesn't repeat
      if (firstHeadingIndex >= 0) lines.splice(firstHeadingIndex, 1);
      postText = lines.join("\\n");

      // Parse markdown
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = marked.parse(postText);

      // Load image metadata
      let imageMeta = {};
      try {
        imageMeta = await fetch('image-data.json').then(res => res.json());
      } catch (e) {
        console.warn("No image metadata found");
      }

      // Add captions & gallery
      const images = Array.from(tempDiv.querySelectorAll('img'));
      let galleryWrapper = null;
      images.forEach(img => {
        const filename = img.getAttribute('src').split('/').pop();
        const caption = (imageMeta && imageMeta[filename]) || "";

        let figure = img.closest('figure');
        if (!figure) {
          figure = document.createElement('figure');
          img.parentNode.insertBefore(figure, img);
          figure.appendChild(img);
        }

        if (caption) {
          let figcap = figure.querySelector('figcaption');
          if (!figcap) {
            figcap = document.createElement('figcaption');
            figure.appendChild(figcap);
          }
          figcap.textContent = caption;
        }

        if (!galleryWrapper) {
          galleryWrapper = document.createElement('div');
          galleryWrapper.classList.add('gallery');
          figure.parentNode.insertBefore(galleryWrapper, figure);
        }
        galleryWrapper.appendChild(figure);
      });

      // TOC Generation
      const tocList = document.getElementById('toc-list');
      const headings = tempDiv.querySelectorAll('h1, h2, h3');
      if (headings.length > 0) {
        document.getElementById('toc').classList.remove('d-none');
        headings.forEach((heading, i) => {
          const id = `heading-${i}`;
          heading.id = id;
          const li = document.createElement('li');
          li.innerHTML = `<a href="#${id}">${heading.textContent}</a>`;
          tocList.appendChild(li);
        });
      }

      // Insert final HTML
      document.getElementById('post-content').innerHTML = tempDiv.innerHTML;
    }

    // Share button
    function sharePost() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url })
          .catch(err => console.log("Share canceled", err));
      } else {
        navigator.clipboard.writeText(url).then(() => {
          alert("Post URL copied to clipboard!");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadPost();
      document.getElementById("shareBtn").addEventListener("click", sharePost);
    });
  </script>
</body>
</html>
