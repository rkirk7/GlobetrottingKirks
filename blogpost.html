<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body { position: relative; }
    p { font-size: 1.5em; }
    #toc {
      position: fixed; top: 80px; right: 20px;
      max-width: 250px; background: #fff;
      border: 1px solid #ddd; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-height: 80vh; overflow-y: auto; z-index: 999;
      font-size: 0.95rem;
    }
    #toc h5 { font-size: 1rem; margin-bottom: 8px; }
    #toc ul { list-style: none; padding-left: 0; margin-bottom: 0; }
    #toc li { margin-bottom: 4px; }
    #toc a { text-decoration: none; font-size: 0.9rem; color: #333; }
    #toc a:hover { color: #007bff; text-decoration: underline; }

    /* Make blog-post-content full width */
    .blog-post-content {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container mt-4 mb-5">
    <div id="post-container" class="card shadow-lg">
      <div class="card-body">
        <h1 id="post-title" class="mb-3"></h1>
        <div id="post-content" class="blog-post-content"></div>
        <div class="mt-3">
          <button id="shareBtn" class="btn btn-outline-primary">Share Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating TOC -->
  <div id="toc" class="d-none">
    <h5>On this page</h5>
    <ul id="toc-list"></ul>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postFile = params.get('post');
      if (!postFile) return;

      // Load Markdown
      let postText = await fetch(`blog-posts/${postFile}`).then(res => res.text());
      postText = postText.replace(/^---[\s\S]*?---/, '').trim();

            // Extract title
const lines = postText.split("\n");
const firstHeadingIndex = lines.findIndex(l => l.startsWith("# "));
const postTitle = firstHeadingIndex >= 0 ? lines[firstHeadingIndex].replace(/^# /, "") : postFile;
document.getElementById('post-title').textContent = postTitle;

// Remove the first H1 line so it doesn't show twice
if (firstHeadingIndex >= 0) {
  lines.splice(firstHeadingIndex, 1);
}
postText = lines.join("\n");

      // Parse markdown
// Parse markdown into a detached div
const tempDiv = document.createElement('div');
tempDiv.innerHTML = marked.parse(postText);

// Load image metadata (filename -> caption)
const captions = await fetch('image-data.json').then(r => r.json()).catch(() => ({}));

// Apply captions to <img alt> using filename
tempDiv.querySelectorAll('img').forEach(img => {
  const src = img.getAttribute('src') || '';
  const filename = src.split('/').pop();
  const cap = captions[filename];
  if (cap && !img.alt) img.alt = cap;
});

// Group consecutive <p><img></p> into .gallery and add captions
function processGalleries(rootEl) {
  const children = Array.from(rootEl.children);
  let run = [];

  const flush = () => {
    if (run.length === 1) {
      const img = run[0].querySelector('img');
      if (img && img.alt) {
        let cap = run[0].querySelector('.caption');
        if (!cap) {
          cap = document.createElement('div');
          cap.className = 'caption';
          cap.textContent = img.alt;
          run[0].appendChild(cap);
        }
      }
    } else if (run.length > 1) {
      const wrap = document.createElement('div');
      wrap.className = 'gallery';
      run[0].parentNode.insertBefore(wrap, run[0]);
      run.forEach(p => {
        const img = p.querySelector('img');
        if (img && img.alt) {
          let cap = p.querySelector('.caption');
          if (!cap) {
            cap = document.createElement('div');
            cap.className = 'caption';
            cap.textContent = img.alt;
            p.appendChild(cap);
          }
        }
        wrap.appendChild(p);
      });
    }
    run = [];
  };

  children.forEach((el, i) => {
    const isImgPara = el.tagName === 'P' && el.querySelector('img') && el.childElementCount === 1;
    if (isImgPara) run.push(el);

    const next = children[i + 1];
    const nextIsImgPara = next && next.tagName === 'P' && next.querySelector('img') && next.childElementCount === 1;
    if (!next || !nextIsImgPara) flush();
  });
}
processGalleries(tempDiv);

// Put processed HTML into the page (now the nodes exist in the DOM)
const postContentEl = document.getElementById('post-content');
postContentEl.innerHTML = '';
postContentEl.appendChild(tempDiv);

// Build TOC from the content now in the DOM
const tocList = document.getElementById('toc-list');
const headings = postContentEl.querySelectorAll('h1, h2, h3');
if (headings.length > 0) {
  document.getElementById('toc').classList.remove('d-none');
  headings.forEach((heading, i) => {
    const id = `heading-${i}`;
    heading.id = id;
    const li = document.createElement('li');
    li.innerHTML = `<a href="#${id}">${heading.textContent}</a>`;
    tocList.appendChild(li);
  });
}

// Lightbox AFTER content is in the DOM
addLightbox('#post-content');

      // Insert final HTML
      document.getElementById('post-content').innerHTML = tempDiv.innerHTML;
    }

    // Share post
    function sharePost() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url })
          .catch(err => console.log("Share canceled", err));
      } else {
        navigator.clipboard.writeText(url).then(() => {
          alert("Post URL copied to clipboard!");
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadPost(); 
      document.getElementById("shareBtn").addEventListener("click", sharePost);
    });
  </script>
</body>
</html>
