<style>
/* Container styling */
.container {
  max-width: 1200px; /* allow bigger iframe on large screens */
  margin: 0 auto;
  padding: 20px;
}

/* Buttons */
.btn {
  display: inline-block;
  padding: 12px 20px;
  background-color: #0077b6;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 1rem;
}
.btn:hover {
  background-color: #005f8c;
}

/* Text center helper */
.text-center {
  text-align: center;
}

/* ------------------------------ */
/* Responsive iframe wrapper      */
/* ------------------------------ */
.iframe-wrapper {
  position: relative;
  width: 100%;
  max-width: 1000px;      /* allow large width on desktop */
  margin: 2em auto;       /* center the iframe */
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(63, 69, 81, 0.16);
  overflow: hidden;

  /* 16:9 aspect ratio */
  padding-top: 56.25%;    /* height / width = 9 / 16 */
}

.iframe-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* ------------------------------ */
/* Mobile adjustments             */
/* ------------------------------ */
@media (max-width: 900px) {
  .iframe-wrapper {
    max-width: 100%;       /* full width on smaller screens */
    padding-top: 56.25%;  /* keep 16:9 ratio */
  }
}
</style>
